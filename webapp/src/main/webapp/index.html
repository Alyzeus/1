<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅行社旅游管理系统</title>
<style>
/* ============================================================
   设计变量
============================================================ */
:root{
  --primary:#1A6B8A;
  --primary-dark:#13526B;
  --primary-light:#E3F0F5;
  --accent:#F0A500;
  --accent-dark:#D29200;
  --bg:#F4F7FA;
  --sidebar:#0D2D3E;
  --sidebar-hover:#16435C;
  --success:#27AE60;
  --warning:#E67E22;
  --danger:#E74C3C;
  --text:#2C3E50;
  --text-light:#7F8C9B;
  --border:#E2E8F0;
  --card-shadow:0 1px 3px rgba(13,45,62,.08), 0 4px 16px rgba(13,45,62,.06);
  --card-shadow-hover:0 4px 12px rgba(13,45,62,.12), 0 8px 28px rgba(13,45,62,.10);
  --radius:10px;
  --ease:cubic-bezier(.4,0,.2,1);
  --sidebar-w:240px;
  --sidebar-w-min:64px;
  --header-h:60px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;
  overflow:hidden;
}
button{font-family:inherit}
input,select,textarea{font-family:inherit;font-size:14px}

/* ============================================================
   通用：按钮 + ripple
============================================================ */
.btn{
  position:relative;overflow:hidden;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:none;border-radius:8px;cursor:pointer;
  padding:9px 18px;font-size:14px;font-weight:600;
  transition:transform .18s var(--ease), box-shadow .18s var(--ease), background .18s var(--ease), opacity .18s;
  -webkit-user-select:none;user-select:none;
}
.btn:disabled{opacity:.65;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#3D2E00;box-shadow:0 2px 6px rgba(240,165,0,.35)}
.btn-primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 16px rgba(240,165,0,.45)}
.btn-blue{background:var(--primary);color:#fff;box-shadow:0 2px 6px rgba(26,107,138,.3)}
.btn-blue:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 16px rgba(26,107,138,.4)}
.btn-ghost{background:#fff;color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 4px 10px rgba(13,45,62,.10)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 16px rgba(231,76,60,.4)}
.btn .ripple{
  position:absolute;border-radius:50%;background:rgba(255,255,255,.55);
  transform:scale(0);animation:ripple .5s var(--ease) forwards;pointer-events:none;
}
@keyframes ripple{to{transform:scale(3.2);opacity:0}}
/* loading 状态 */
.btn.loading{pointer-events:none;opacity:.8}
.spinner{
  width:15px;height:15px;border-radius:50%;flex:none;
  border:2px solid rgba(0,0,0,.18);border-top-color:currentColor;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============================================================
   登录页
============================================================ */
#loginView{
  position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  overflow:hidden;transition:opacity .4s var(--ease);
}
#loginView.leaving{opacity:0;pointer-events:none}
.login-bg{
  position:absolute;inset:-5%;width:110%;height:110%;
  animation:kenburns 30s var(--ease) infinite alternate;
  background:linear-gradient(180deg,#7FB6CC 0%,#A8CFDE 38%,#DCEAF1 60%,#F0E6C8 100%);
}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.08)}}
.login-bg svg{position:absolute;inset:0;width:100%;height:100%}
#loginView::after{ /* 暗角，提升卡片可读性 */
  content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse at center,transparent 40%,rgba(13,45,62,.28) 100%);
  pointer-events:none;
}
.login-card{
  position:relative;z-index:2;width:400px;max-width:92vw;
  background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-radius:16px;padding:38px 40px 32px;
  box-shadow:0 20px 60px rgba(13,45,62,.35);
  opacity:0;transform:translateY(40px);
  animation:cardIn .6s var(--ease) .15s forwards;
}
@keyframes cardIn{to{opacity:1;transform:translateY(0)}}
.login-logo{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:6px}
.logo-mark{
  width:46px;height:46px;border-radius:12px;flex:none;
  background:linear-gradient(135deg,var(--primary),#2A8FB5);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(26,107,138,.4);
}
.logo-mark svg{width:26px;height:26px}
.login-title{font-size:21px;font-weight:700;color:var(--primary-dark);letter-spacing:1px}
.login-sub{text-align:center;color:var(--text-light);font-size:13px;margin-bottom:26px;letter-spacing:3px}
.field{margin-bottom:18px;position:relative}
.field label{display:block;font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px}
.field label .req{color:var(--danger);margin-left:2px}
.input-wrap{position:relative}
.input-wrap .icon{
  position:absolute;left:11px;top:50%;transform:translateY(-50%);
  width:17px;height:17px;color:#9DB0BE;pointer-events:none;
}
.field input{
  width:100%;height:42px;padding:0 36px 0 38px;
  border:1.5px solid var(--border);border-radius:9px;background:#fff;
  outline:none;color:var(--text);
  transition:border-color .2s var(--ease), box-shadow .2s var(--ease);
}
.field input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(26,107,138,.13)}
/* 校验状态 */
.field.error input{border-color:var(--danger);box-shadow:0 0 0 3px rgba(231,76,60,.12)}
.field.error .input-wrap{animation:shake .45s var(--ease)}
.field.ok input{border-color:var(--success)}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  16%{transform:translateX(-7px)}33%{transform:translateX(6px)}
  50%{transform:translateX(-5px)}66%{transform:translateX(4px)}83%{transform:translateX(-2px)}
}
.field .msg{font-size:12px;color:var(--danger);margin-top:5px;min-height:15px;opacity:0;transform:translateY(-3px);transition:all .2s var(--ease)}
.field.error .msg{opacity:1;transform:translateY(0)}
.field .check{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  color:var(--success);font-weight:700;font-size:15px;
  opacity:0;transition:opacity .25s var(--ease);pointer-events:none;
}
.field.ok .check{opacity:1}
.captcha-row{display:flex;gap:10px}
.captcha-row .input-wrap{flex:1}
#captchaCanvas{
  width:108px;height:42px;border-radius:9px;cursor:pointer;flex:none;
  border:1.5px solid var(--border);background:#fff;
  transition:box-shadow .2s var(--ease);
}
#captchaCanvas:hover{box-shadow:0 2px 8px rgba(13,45,62,.15)}
.login-btn{width:100%;height:44px;font-size:15px;letter-spacing:6px;margin-top:4px}
.login-foot{text-align:center;margin-top:18px;font-size:12px;color:var(--text-light)}
.login-foot b{color:var(--primary)}

/* ============================================================
   主框架布局
============================================================ */
#appShell{display:flex;height:100vh;opacity:0;transition:opacity .4s var(--ease)}
#appShell.ready{opacity:1}

/* ---------- 侧边栏 ---------- */
#sidebar{
  width:var(--sidebar-w);height:100%;flex:none;
  background:var(--sidebar);color:#B8CAD5;
  display:flex;flex-direction:column;
  transition:width .28s var(--ease);
  position:relative;z-index:30;
}
#sidebar .brand{
  height:var(--header-h);flex:none;display:flex;align-items:center;gap:11px;
  padding:0 16px;border-bottom:1px solid rgba(255,255,255,.07);overflow:hidden;white-space:nowrap;
}
#sidebar .brand .logo-mark{width:34px;height:34px;border-radius:9px}
#sidebar .brand .logo-mark svg{width:19px;height:19px}
#sidebar .brand b{color:#fff;font-size:16px;letter-spacing:1px;transition:opacity .2s var(--ease)}
.nav-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 0 16px;position:relative}
.nav-scroll::-webkit-scrollbar{width:5px}
.nav-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px}
.nav-group-title{
  padding:16px 20px 7px;font-size:11px;color:#5E7B8C;letter-spacing:2px;
  white-space:nowrap;overflow:hidden;transition:opacity .2s var(--ease);
}
.nav-item{
  display:flex;align-items:center;gap:11px;height:42px;padding:0 18px;
  cursor:pointer;white-space:nowrap;position:relative;
  transition:background .18s var(--ease), color .18s var(--ease);
}
.nav-item:hover{background:var(--sidebar-hover);color:#fff}
.nav-item.active{background:rgba(26,107,138,.45);color:#fff}
.nav-item .nicon{width:18px;height:18px;flex:none}
.nav-item .ntext{transition:opacity .2s var(--ease)}
/* 滑动指示条 */
#navIndicator{
  position:absolute;left:0;width:3px;height:42px;border-radius:0 3px 3px 0;
  background:var(--accent);
  transition:transform .3s var(--ease), opacity .2s;
  box-shadow:0 0 8px rgba(240,165,0,.6);
}
/* 折叠态 */
#appShell.collapsed #sidebar{width:var(--sidebar-w-min)}
#appShell.collapsed .ntext,
#appShell.collapsed .nav-group-title,
#appShell.collapsed .brand b{opacity:0;clip-path:inset(0 100% 0 0)}
#appShell.collapsed .nav-item{padding:0 23px}
.ntext,.nav-group-title,.brand b{clip-path:inset(0 0 0 0);transition:opacity .2s var(--ease), clip-path .25s var(--ease)}

/* ---------- 主区域 ---------- */
.main-col{flex:1;display:flex;flex-direction:column;min-width:0}
#topbar{
  height:var(--header-h);flex:none;display:flex;align-items:center;gap:14px;
  padding:0 22px;background:rgba(255,255,255,.85);
  border-bottom:1px solid var(--border);
  position:relative;z-index:20;
  transition:backdrop-filter .3s var(--ease), box-shadow .3s var(--ease), background .3s var(--ease);
}
#topbar.scrolled{
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  background:rgba(255,255,255,.72);
  box-shadow:0 2px 12px rgba(13,45,62,.08);
}
#collapseBtn{
  width:34px;height:34px;border:none;background:transparent;border-radius:8px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:var(--text-light);
  transition:background .18s,color .18s;
}
#collapseBtn:hover{background:var(--primary-light);color:var(--primary)}
.breadcrumb{font-size:14px;color:var(--text-light)}
.breadcrumb b{color:var(--text);font-weight:600}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:16px}
.user-chip{
  display:flex;align-items:center;gap:9px;cursor:pointer;padding:5px 10px;border-radius:9px;
  transition:background .18s;
}
.user-chip:hover{background:var(--primary-light)}
.avatar{
  width:32px;height:32px;border-radius:50%;flex:none;
  background:linear-gradient(135deg,var(--primary),#2A8FB5);
  color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;
}
.user-chip .uname{font-weight:600}
.user-chip .urole{font-size:12px;color:var(--text-light)}

#content{flex:1;overflow-y:auto;padding:22px 24px 40px;scroll-behavior:smooth}
/* 页面切换动效 */
.page{animation:pageIn .28s var(--ease)}
@keyframes pageIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.page-title{font-size:19px;font-weight:700;color:var(--primary-dark);margin-bottom:4px}
.page-desc{color:var(--text-light);font-size:13px;margin-bottom:18px}

/* ============================================================
   卡片 / 滚动入场
============================================================ */
.card{
  background:#fff;border-radius:var(--radius);box-shadow:var(--card-shadow);
  padding:20px;transition:box-shadow .25s var(--ease);
}
.card:hover{box-shadow:var(--card-shadow-hover)}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .5s var(--ease),transform .5s var(--ease)}
.reveal.shown{opacity:1;transform:translateY(0)}

/* 统计卡片 */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:20px}
.stat-card{display:flex;align-items:center;gap:15px}
.stat-icon{
  width:48px;height:48px;border-radius:12px;flex:none;
  display:flex;align-items:center;justify-content:center;color:#fff;
}
.stat-icon svg{width:24px;height:24px}
.stat-card .num{font-size:25px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums}
.stat-card .lbl{font-size:12.5px;color:var(--text-light);margin-top:2px}

/* ============================================================
   表格
============================================================ */
.table-card{padding:0;overflow:hidden}
.table-toolbar{display:flex;align-items:center;gap:12px;padding:16px 20px;flex-wrap:wrap}
.table-toolbar .spacer{flex:1}
.search-box{position:relative}
.search-box input{
  height:36px;width:220px;padding:0 12px 0 34px;border:1.5px solid var(--border);border-radius:8px;
  outline:none;transition:border-color .2s,box-shadow .2s;background:#FAFCFD;
}
.search-box input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(26,107,138,.12);background:#fff}
.search-box svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:#9DB0BE}
.filter-sel{
  height:36px;padding:0 10px;border:1.5px solid var(--border);border-radius:8px;outline:none;
  background:#FAFCFD;color:var(--text);cursor:pointer;transition:border-color .2s;
}
.filter-sel:focus{border-color:var(--primary)}
table{width:100%;border-collapse:collapse}
thead th{
  text-align:left;padding:11px 18px;font-size:12.5px;color:var(--text-light);
  background:#F8FAFC;border-bottom:1px solid var(--border);font-weight:600;letter-spacing:.5px;white-space:nowrap;
}
tbody td{padding:12px 18px;border-bottom:1px solid #EEF2F6;white-space:nowrap}
tbody tr{position:relative;transition:background .18s var(--ease)}
tbody tr:nth-child(even){background:#FAFCFD}
tbody tr:hover{background:var(--primary-light)}
tbody tr::before{ /* hover 左侧彩色竖线 */
  content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent);
  transform:scaleY(0);transition:transform .2s var(--ease);
}
tbody tr:hover::before{transform:scaleY(1)}
/* 行 stagger 入场 */
tbody tr.row-in{opacity:0;transform:translateY(10px);animation:rowIn .35s var(--ease) forwards}
@keyframes rowIn{to{opacity:1;transform:translateY(0)}}
.op-link{
  background:none;border:none;cursor:pointer;font-size:13px;padding:3px 6px;border-radius:6px;
  color:var(--primary);transition:background .15s;
}
.op-link:hover{background:rgba(26,107,138,.1)}
.op-link.danger{color:var(--danger)}
.op-link.danger:hover{background:rgba(231,76,60,.1)}

/* 骨架屏 */
.sk-cell{height:14px;border-radius:6px;background:#EAEFF4;position:relative;overflow:hidden}
.sk-cell::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);
  transform:translateX(-100%);animation:shimmer 1.3s infinite;
}
@keyframes shimmer{to{transform:translateX(100%)}}

/* 分页器 */
.pager{display:flex;align-items:center;gap:6px;padding:14px 20px;justify-content:flex-end}
.pager button{
  min-width:30px;height:30px;border:1px solid var(--border);background:#fff;border-radius:7px;
  cursor:pointer;color:var(--text);transition:all .15s var(--ease);padding:0 8px;
}
.pager button:hover:not(:disabled){border-color:var(--primary);color:var(--primary)}
.pager button.cur{background:var(--primary);border-color:var(--primary);color:#fff}
.pager button:disabled{opacity:.4;cursor:not-allowed}
.pager .pinfo{font-size:12.5px;color:var(--text-light);margin-right:auto}

/* ============================================================
   Badge
============================================================ */
.badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;
}
.badge .dot{width:6px;height:6px;border-radius:50%;flex:none}
.badge-green{background:rgba(39,174,96,.12);color:#1E8A4C}.badge-green .dot{background:var(--success)}
.badge-orange{background:rgba(230,126,34,.13);color:#C2691A}.badge-orange .dot{background:var(--warning)}
.badge-red{background:rgba(231,76,60,.12);color:#C0392B}.badge-red .dot{background:var(--danger)}
.badge-gray{background:rgba(127,140,155,.14);color:#66788A}.badge-gray .dot{background:#92A4B4}
.badge-blue{background:rgba(26,107,138,.12);color:var(--primary)}.badge-blue .dot{background:var(--primary)}
/* 呼吸灯（进行中类状态） */
.badge.live .dot{animation:pulse 2s var(--ease) infinite}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(39,174,96,.5)}
  50%{box-shadow:0 0 0 5px rgba(39,174,96,0)}
}

/* ============================================================
   Modal
============================================================ */
#modalRoot{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center}
#modalRoot.open{display:flex}
.modal-mask{
  position:absolute;inset:0;background:rgba(13,45,62,.5);
  opacity:0;transition:opacity .25s var(--ease);
}
#modalRoot.show .modal-mask{opacity:1}
.modal-box{
  position:relative;background:#fff;border-radius:14px;width:480px;max-width:92vw;max-height:86vh;
  display:flex;flex-direction:column;
  box-shadow:0 24px 70px rgba(13,45,62,.4);
  opacity:0;transform:scale(.92);
  transition:opacity .25s var(--ease), transform .25s var(--ease);
}
#modalRoot.show .modal-box{opacity:1;transform:scale(1)}
.modal-box.shake-hint{animation:modalShake .35s var(--ease)}
@keyframes modalShake{
  0%,100%{transform:scale(1) translateX(0)}
  25%{transform:scale(1) translateX(-6px)}50%{transform:scale(1) translateX(5px)}75%{transform:scale(1) translateX(-3px)}
}
.modal-head{display:flex;align-items:center;padding:18px 22px 0}
.modal-head h3{font-size:16px;color:var(--primary-dark)}
.modal-close{
  margin-left:auto;width:30px;height:30px;border:none;background:transparent;border-radius:8px;
  cursor:pointer;font-size:17px;color:var(--text-light);transition:background .15s,color .15s;
}
.modal-close:hover{background:rgba(231,76,60,.1);color:var(--danger)}
.modal-body{padding:16px 22px;overflow-y:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:0 22px 20px}
.modal-body .field input,.modal-body .field select{
  padding:0 12px;height:40px;width:100%;border:1.5px solid var(--border);border-radius:9px;outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.modal-body .field input:focus,.modal-body .field select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(26,107,138,.12)}
.confirm-icon{
  width:52px;height:52px;border-radius:50%;margin:4px auto 14px;
  background:rgba(231,76,60,.12);color:var(--danger);
  display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;
}

/* ============================================================
   Toast
============================================================ */
#toastRoot{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:10px;align-items:center}
.toast{
  display:flex;align-items:center;gap:9px;padding:10px 18px;border-radius:10px;background:#fff;
  box-shadow:0 8px 30px rgba(13,45,62,.2);font-size:13.5px;font-weight:600;
  opacity:0;transform:translateY(-14px);
  animation:toastIn .3s var(--ease) forwards;
}
.toast.out{animation:toastOut .3s var(--ease) forwards}
@keyframes toastIn{to{opacity:1;transform:translateY(0)}}
@keyframes toastOut{to{opacity:0;transform:translateY(-14px)}}
.toast.success{color:#1E8A4C}.toast.error{color:var(--danger)}.toast.info{color:var(--primary)}

/* 占位页 */
.placeholder-card{text-align:center;padding:70px 20px;color:var(--text-light)}
.placeholder-card .ph-icon{font-size:44px;margin-bottom:14px}
.placeholder-card h3{color:var(--text);margin-bottom:8px;font-size:17px}

/* ============================================================
   页面内表单（非弹窗）
============================================================ */
.page .field input,.page .field select{
  padding:0 12px;height:40px;width:100%;border:1.5px solid var(--border);border-radius:9px;
  outline:none;background:#fff;transition:border-color .2s,box-shadow .2s;color:var(--text);
}
.page .field input:focus,.page .field select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(26,107,138,.12)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 18px}

/* ============================================================
   步骤条（分步表单）
============================================================ */
.steps{display:flex;align-items:center;justify-content:center;margin:6px 0 26px}
.step{display:flex;align-items:center;gap:10px}
.step .s-dot{
  width:34px;height:34px;border-radius:50%;background:#E2E8F0;color:var(--text-light);flex:none;
  display:flex;align-items:center;justify-content:center;font-weight:700;
  transition:background .3s var(--ease),color .3s,box-shadow .3s;
}
.step .s-name{font-size:13px;color:var(--text-light);transition:color .3s}
.step.active .s-dot{background:var(--primary);color:#fff;box-shadow:0 0 0 5px rgba(26,107,138,.15)}
.step.active .s-name{color:var(--primary);font-weight:700}
.step.done .s-dot{background:var(--success);color:#fff}
.step.done .s-name{color:var(--success)}
.s-line{width:70px;height:2px;background:#E2E8F0;margin:0 14px;position:relative;overflow:hidden}
.s-line::after{content:"";position:absolute;inset:0;background:var(--success);transform:scaleX(0);transform-origin:left;transition:transform .4s var(--ease)}
.s-line.done::after{transform:scaleX(1)}
.step-panel{animation:pageIn .3s var(--ease)}

/* 选择卡片（线路/班次/宾馆挑选） */
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:14px}
.pick-card{
  border:1.5px solid var(--border);border-radius:10px;padding:14px 16px;cursor:pointer;background:#fff;
  transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s,background .2s;
}
.pick-card:hover{transform:translateY(-2px);box-shadow:var(--card-shadow-hover)}
.pick-card.sel{border-color:var(--primary);background:var(--primary-light);box-shadow:0 0 0 3px rgba(26,107,138,.15)}
.pick-card.disabled{opacity:.5;cursor:not-allowed}

.pick-card .pc-sub{font-size:12px;color:var(--text-light);line-height:1.7}
.pick-card .pc-price{color:var(--accent-dark);font-weight:800;font-size:16px}

/* 回执单 */

============================================================ */

<script>
"use strict";
/* ============================================================
   工具
============================================================ */
const $  = (s, p=document) => p.querySelector(s);
const $$ = (s, p=document) => [...p.querySelectorAll(s)];
const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ripple 水波纹（事件委托，作用于所有 .btn） */
document.addEventListener("pointerdown", e => {
  const btn = e.target.closest(".btn");
  if (!btn || btn.disabled || reducedMotion) return;
  const r = btn.getBoundingClientRect();
  const d = Math.max(r.width, r.height);
  const sp = document.createElement("span");
  sp.className = "ripple";
  sp.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
  btn.appendChild(sp);
  sp.addEventListener("animationend", () => sp.remove());
});

/* 按钮 loading 状态 */
function setBtnLoading(btn, on, textWhile="处理中...") {
  if (on) {
    btn.dataset.html = btn.innerHTML;
    btn.classList.add("loading");
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner"></span>${textWhile}`;
  } else {
    btn.classList.remove("loading");
    btn.disabled = false;
    btn.innerHTML = btn.dataset.html || btn.innerHTML;
  }
}

/* Toast */
function toast(msg, type="success", dur=2200) {
  const icons = {success:"✓", error:"✕", info:"ℹ"};
  const el = document.createElement("div");
  el.className = `toast ${type}`;
  el.innerHTML = `<b>${icons[type]||""}</b><span>${msg}</span>`;
  $("#toastRoot").appendChild(el);
  setTimeout(() => { el.classList.add("out"); el.addEventListener("animationend", () => el.remove()); }, dur);
}

/* ============================================================
   Modal
============================================================ */
const modalRoot = $("#modalRoot"), modalBox = $("#modalBox");
let modalOnOk = null;

function openModal({title, body, okText="确 认", danger=false, onOk=null, hideFoot=false}) {
  modalOnOk = onOk;
  modalBox.innerHTML = `
    <div class="modal-head"><h3>${title}</h3><button class="modal-close" data-close>✕</button></div>
    <div class="modal-body">${body}</div>
    ${hideFoot ? "" : `<div class="modal-foot">
      <button class="btn btn-ghost" data-close>取 消</button>
      <button class="btn ${danger ? "btn-danger" : "btn-primary"}" id="modalOkBtn">${okText}</button>
    </div>`}`;
  modalRoot.classList.add("open");
  requestAnimationFrame(() => requestAnimationFrame(() => modalRoot.classList.add("show")));
  const ok = $("#modalOkBtn");
  if (ok) ok.addEventListener("click", () => { if (modalOnOk) modalOnOk(ok); else closeModal(); });
}
function closeModal() {
  modalRoot.classList.remove("show");
  setTimeout(() => { modalRoot.classList.remove("open"); modalBox.innerHTML = ""; }, 260);
}
modalRoot.addEventListener("click", e => {
  if (e.target.closest("[data-close]")) return closeModal();
  if (e.target.classList.contains("modal-mask")) { /* 点蒙层：轻微 shake 提示 */
    modalBox.classList.remove("shake-hint");
    void modalBox.offsetWidth;
    modalBox.classList.add("shake-hint");
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && modalRoot.classList.contains("open")) closeModal(); });

function confirmDelete(name, after) {
  openModal({
    title: "删除确认", danger: true, okText: "确认删除",
    body: `<div class="confirm-icon">!</div>
           <p style="text-align:center;line-height:1.8">确定要删除 <b style="color:var(--danger)">${name}</b> 吗？<br>
           <span style="color:var(--text-light);font-size:12.5px">此操作不可恢复，请谨慎操作。</span></p>`,
    onOk(btn) {
      setBtnLoading(btn, true, "删除中...");
      setTimeout(() => { closeModal(); toast(`已删除：${name}`); if (after) after(); }, 700);
    }
  });
}

/* ============================================================
   验证码
============================================================ */
let captchaText = "";
function drawCaptcha() {
  const cv = $("#captchaCanvas"), ctx = cv.getContext("2d");
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  captchaText = Array.from({length:4}, () => chars[Math.random()*chars.length|0]).join("");
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.fillStyle = "#F4F9FB"; ctx.fillRect(0,0,cv.width,cv.height);
  for (let i=0;i<5;i++){ /* 干扰线 */
    ctx.strokeStyle = `rgba(26,107,138,${.15+Math.random()*.2})`;
    ctx.lineWidth = 2; ctx.beginPath();
    ctx.moveTo(Math.random()*cv.width, Math.random()*cv.height);
    ctx.bezierCurveTo(Math.random()*cv.width,Math.random()*cv.height,Math.random()*cv.width,Math.random()*cv.height,Math.random()*cv.width,Math.random()*cv.height);
    ctx.stroke();
  }
  const colors = ["#1A6B8A","#0D2D3E","#D29200","#2C6A85"];
  captchaText.split("").forEach((ch,i) => {
    ctx.save();
    ctx.font = `bold ${44+Math.random()*10}px Georgia`;
    ctx.fillStyle = colors[i%colors.length];
    ctx.translate(30+i*48, 54+Math.random()*8-4);
    ctx.rotate((Math.random()*30-15)*Math.PI/180);
    ctx.fillText(ch, -14, 14);
    ctx.restore();
  });
  for (let i=0;i<26;i++){ /* 噪点 */
    ctx.fillStyle = `rgba(13,45,62,${Math.random()*.3})`;
    ctx.fillRect(Math.random()*cv.width, Math.random()*cv.height, 2.4, 2.4);
  }
}
$("#captchaCanvas").addEventListener("click", drawCaptcha);
drawCaptcha();

/* ============================================================
   登录逻辑（连接 MySQL 数据库）
============================================================ */
let currentUser = null;
function validateField(fieldEl, ok, msg) {
  fieldEl.classList.remove("error","ok");
  void fieldEl.offsetWidth;            /* 重置 shake 动画 */
  if (ok) fieldEl.classList.add("ok");
  else {
    if (msg) fieldEl.querySelector(".msg").textContent = msg;
    fieldEl.classList.add("error");
  }
  return ok;
}
["username","password","captchaInput"].forEach(id => {
  $("#"+id).addEventListener("input", e => e.target.closest(".field").classList.remove("error","ok"));
});

$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const u = $("#username").value.trim(),
        p = $("#password").value,
        c = $("#captchaInput").value.trim().toUpperCase();
  let ok = true;
  ok = validateField($("#fUser"), !!u, "请输入用户名") && ok;
  ok = validateField($("#fPass"), !!p, "请输入密码") && ok;
  ok = validateField($("#fCode"), !!c && c === captchaText, c ? "验证码错误，请重新输入" : "请输入验证码") && ok;
  if (!ok) { if (c && c !== captchaText) drawCaptcha(); return; }

  const btn = $("#loginBtn");
  setBtnLoading(btn, true, "登录中...");
  try {
    const r = await fetch("/login", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: "username=" + encodeURIComponent(u) + "&password=" + encodeURIComponent(p) + "&fmt=json"
    });
    const d = await r.json();
    if (d.ok) {
      currentUser = { name: d.user, role: d.role, username: d.username };
      toast("登录成功，欢迎回来！");
      enterApp();
    } else {
      setBtnLoading(btn, false);
      validateField($("#fUser"), false, "用户名或密码错误");
      validateField($("#fPass"), false, " ");
      drawCaptcha(); $("#captchaInput").value = "";
      $("#fCode").classList.remove("ok");
    }
  } catch (ex) {
    setBtnLoading(btn, false);
    validateField($("#fUser"), false, "服务器连接失败");
  }
});

============================================================ */
const API_BASE = "/api";

async function apiGet(path) {
  const r = await fetch(API_BASE + path);
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

async function apiPost(path, data) {
  const r = await fetch(API_BASE + path, {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: new URLSearchParams(data).toString()
  });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

async function apiDel(path, data) {
  return apiPost(path + "/delete", data);
}

/* 从后端拉取所有数据并填充 MOCK */
async function loadAllData() {
  try {
    // 并行加载所有数据
    const [routes, batches, guides, hotels, tourists, registrations, groups, insurances, dashStats, users]
      = await Promise.all([
        apiGet("/routes").catch(() => ({data:[]})),
        apiGet("/batches").catch(() => ({data:[]})),
        apiGet("/guides").catch(() => ({data:[]})),
        apiGet("/hotels").catch(() => ({data:[]})),
        apiGet("/tourists").catch(() => ({data:[]})),
        apiGet("/registrations").catch(() => ({data:[]})),
        apiGet("/groups").catch(() => ({data:[]})),
        apiGet("/insurances").catch(() => ({data:[]})),
        apiGet("/dashboard/stats").catch(() => ({signups:0,inGroup:0,activeGroups:0,income:0})),
        (currentUser && currentUser.role === "管理员"
          ? apiGet("/users").catch(() => ({data:MOCK.users}))
          : Promise.resolve({data:MOCK.users}))
      ]);

    // 转换 routes 数据
    if (routes.data && routes.data.length) {
      MOCK.routes = routes.data.map(r => ({
        code: r.route_no,
        name: (r.start_place || "") + "→" + (r.end_place || ""),
        days: r.days || 1,
        spots: r.main_spots || "",
        price: 0,
        status: "在售",
        route_no: r.route_no,
        start_place: r.start_place,
        end_place: r.end_place
      }));
    }

    // 转换 batches 数据
    if (batches.data && batches.data.length) {
      MOCK.batches = batches.data.map(b => ({
        no: b.batch_no,
        route: (b.start_place || "") + "→" + (b.end_place || ""),
        depart: b.depart_date ? b.depart_date.substring(0,10) : "",
        status: "报名中",
        count: 0,
        batch_no: b.batch_no,
        route_no: b.route_no,
        price: b.price || 0,
        discount: b.discount || 1
      }));
    }

    // 转换 guides 数据
    if (guides.data && guides.data.length) {
      MOCK.guides = guides.data.map(g => ({
        no: g.guide_no,
        name: g.name || "",
        level: g.level || "初级",
        phone: "",
        status: "空闲",
        guide_no: g.guide_no,
        language: g.language
      }));
    }

    // 转换 hotels 数据
    if (hotels.data && hotels.data.length) {
      MOCK.hotels = hotels.data.map(h => ({
        name: h.hotel_name || "",
        addr: h.city || "",
        roomType: "标准间",
        price: h.price || 0,
        avail: 0,
        hotel_no: h.hotel_no,
        stars: h.stars
      }));
    }

    // 转换 tourists 数据
    if (tourists.data && tourists.data.length) {
      MOCK.tourists = tourists.data.map(t => ({
        name: t.name || "",
        idcard: t.id_card || "",
        phone: t.phone || "",
        batch: "",
        group: "",
        status: "已报名",
        tourist_no: t.tourist_no,
        gender: t.gender
      }));
    }

    // 转换 registrations 数据（仅当有实际数据时覆盖 MOCK）
    if (registrations.data && registrations.data.length) {
      REG_DATA = registrations.data.map(r => ({
        id: "BM" + (r.reg_no || ""),
        name: r.tourist_name || "",
        route: (r.start_place || "") + "→" + (r.end_place || ""),
        batch: r.batch_no || "待分配",
        fee: 0,
        status: "未成团",
        reg_no: r.reg_no,
        route_no: r.route_no
      }));
    }

    // 转换 groups 数据
    if (groups.data && groups.data.length) {
      MOCK.groups = groups.data.map(g => ({
        name: g.group_name || "",
        batch: g.batch_no || "",
        depart: g.depart_date ? g.depart_date.substring(0,10) : "",
        members: g.actual_count || 0,
        status: (g.actual_count || 0) >= 20 ? "已成团" : "未成团",
        guide: "",
        hotel: "",
        insured: false,
        paid: false,
        group_no: g.group_no
      }));
    }

    // 转换 users 数据
    if (users.data && users.data.length) {
      MOCK.users = users.data.map(u => ({
        username: u.username || "",
        realname: u.realname || "",
        role: u.role || "",
        phone: u.phone || "",
        status: u.status || "启用",
        created: u.created || ""
      }));
    }

    // 仪表盘统计（仅当 API 返回非零数据时才覆盖 MOCK，避免空数据库清零）
    if (dashStats && dashStats.ok && (dashStats.signups > 0 || dashStats.inGroup > 0 || dashStats.activeGroups > 0 || dashStats.income > 0)) {
      DASH_STATS = dashStats;
    }

    return true;
  } catch (e) {
    console.warn("API data load failed, using MOCK:", e.message);
    return false;
  }
}

/* ============================================================
   滚动入场（IntersectionObserver, threshold 0.15）
============================================================ */
const io = new IntersectionObserver(entries => {
  entries.forEach(en => {
    if (en.isIntersecting) {
      en.target.classList.add("shown");
      if (en.target.dataset.countTo) countUp(en.target);
      io.unobserve(en.target);
    }
  });
}, {root: $("#content"), threshold: 0.15});
function bindReveal(scope){ $$(".reveal", scope).forEach(el => io.observe(el)); $$("[data-count-to]", scope).forEach(el => io.observe(el)); }

/* CountUp 数字滚动 */
function countUp(el) {
  const target = parseFloat(el.dataset.countTo);
  const decimals = +(el.dataset.decimals || 0);
  const prefix = el.dataset.prefix || "", suffix = el.dataset.suffix || "";
  if (reducedMotion) { el.textContent = prefix + target.toLocaleString("zh-CN",{minimumFractionDigits:decimals,maximumFractionDigits:decimals}) + suffix; return; }
  const dur = 1500, t0 = performance.now();
  (function tick(t){
    const p = Math.min((t - t0) / dur, 1);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = prefix + (target * eased).toLocaleString("zh-CN",{minimumFractionDigits:decimals,maximumFractionDigits:decimals}) + suffix;
    if (p < 1) requestAnimationFrame(tick);
  })(t0);
}

/* ============================================================
   页面初始化逻辑
============================================================ */
const PAGE_INIT = {
  dashboard(page){
    const tbody = $("#dashTbody", page);
    const PAGE_SIZE = 5;
    let kw = "", st = "", cur = 1;

    function skeleton(){
      tbody.innerHTML = Array.from({length:PAGE_SIZE}, () =>
        `<tr>${Array.from({length:7}, (_,i) => `<td><div class="sk-cell" style="width:${[72,56,120,64,48,68,90][i]}px"></div></td>`).join("")}</tr>`
      ).join("");
    }
    function filtered(){
      return REG_DATA.filter(r =>
        (!kw || (r.name+r.route+r.batch+r.id).toLowerCase().includes(kw)) &&
        (!st || r.status === st));
    }
    function renderRows(){
      const data = filtered();
      const pages = Math.max(1, Math.ceil(data.length / PAGE_SIZE));
      cur = Math.min(cur, pages);
      const slice = data.slice((cur-1)*PAGE_SIZE, cur*PAGE_SIZE);
      tbody.innerHTML = slice.length ? slice.map((r,i) => `
        <tr class="row-in" style="animation-delay:${i*40}ms">
          <td style="color:var(--text-light)">${r.id}</td>
          <td><b>${r.name}</b></td>
          <td>${r.route}</td>
          <td><span class="badge badge-blue">${r.batch}</span></td>
          <td>¥ ${r.fee.toLocaleString()}</td>
          <td>${statusBadge(r.status)}</td>
          <td>
            <button class="op-link" data-op="view" data-id="${r.id}">查看</button>
            <button class="op-link" data-op="edit" data-id="${r.id}">编辑</button>
            <button class="op-link danger" data-op="del" data-id="${r.id}">删除</button>
          </td>
        </tr>`).join("")
        : `<tr><td colspan="7" style="text-align:center;color:var(--text-light);padding:34px">未找到匹配记录</td></tr>`;
      renderPager(data.length, pages);
    }
    function renderPager(total, pages){
      $("#dashPager", page).innerHTML = `
        <span class="pinfo">共 ${total} 条记录，第 ${cur}/${pages} 页</span>
        <button ${cur===1?"disabled":""} data-pg="prev">‹</button>
        ${Array.from({length:pages}, (_,i) => `<button class="${i+1===cur?"cur":""}" data-pg="${i+1}">${i+1}</button>`).join("")}
        <button ${cur===pages?"disabled":""} data-pg="next">›</button>`;
    }
    $("#dashPager", page).addEventListener("click", e => {
      const b = e.target.closest("button[data-pg]");
      if (!b || b.disabled) return;
      const v = b.dataset.pg;
      cur = v === "prev" ? cur-1 : v === "next" ? cur+1 : +v;
      renderRows();
    });
    $("#dashSearch", page).addEventListener("input", e => { kw = e.target.value.trim().toLowerCase(); cur = 1; renderRows(); });
    $("#dashFilter", page).addEventListener("change", e => { st = e.target.value; cur = 1; renderRows(); });

    /* 操作列 */
    tbody.addEventListener("click", e => {
      const b = e.target.closest(".op-link");
      if (!b) return;
      const rec = REG_DATA.find(r => r.id === b.dataset.id);
      if (b.dataset.op === "del") {
        confirmDelete(`报名记录 ${rec.id}（${rec.name}）`, () => {
          REG_DATA.splice(REG_DATA.indexOf(rec), 1);
          renderRows();
        });
      } else if (b.dataset.op === "view") {
        openModal({title:"报名详情", hideFoot:true, body:`
          <table style="font-size:13.5px">
            ${Object.entries({编号:rec.id, 姓名:rec.name, 线路:rec.route, 班次:rec.batch, 团费:"¥ "+rec.fee.toLocaleString(), 状态:rec.status})
              .map(([k,v]) => `<tr><td style="color:var(--text-light);width:90px">${k}</td><td><b>${v}</b></td></tr>`).join("")}
          </table>`});
      } else {
        demoFormModal("编辑报名", rec, renderRows);
      }
    });
    $("#demoAddBtn", page).addEventListener("click", () => demoFormModal("新增报名", null, renderRows));

    /* 骨架屏 → stagger 入场 */
    skeleton();
    setTimeout(renderRows, reducedMotion ? 0 : 750);
  }
};

/* ============================================================
   通用 CRUD 列表页工厂
============================================================ */
function skeletonRows(tbody, cols, rows){
  tbody.innerHTML = Array.from({length:rows}, () =>
    `<tr>${Array.from({length:cols}, () => `<td><div class="sk-cell" style="width:${50+Math.random()*70|0}px"></div></td>`).join("")}</tr>`
  ).join("");
}

function crudFieldHtml(f, rec){
  const v = rec ? (rec[f.key] ?? "") : (f.default ?? "");
  let input;
  if (f.type === "select") {
    const opts = typeof f.options === "function" ? f.options() : f.options;
    input = `<select id="cf_${f.key}"><option value="">请选择${f.label}</option>${opts.map(o => `<option ${String(v)===String(o)?"selected":""}>${o}</option>`).join("")}</select>`;
  } else {
    input = `<input id="cf_${f.key}" type="${f.type||"text"}" value="${v}" placeholder="${f.placeholder||"请输入"+f.label}">`;
  }
  return `<div class="field" id="cff_${f.key}">
    <label>${f.label}<span class="req">*</span></label>
    <div class="input-wrap">${input}<span class="check" style="right:14px">✓</span></div>
    <div class="msg">请${f.type==="select"?"选择":"正确填写"}${f.label}</div>
  </div>`;
}

function crudFormModal(cfg, rec, after){
  openModal({
    title: (rec ? "编辑" : (cfg.addLabel || "新增")) + cfg.entity, okText: "提 交",
    body: cfg.form.map(f => crudFieldHtml(f, rec)).join(""),
    onOk(btn){
      let ok = true; const vals = {};
      cfg.form.forEach(f => {
        const el = $("#cf_"+f.key);
        let v = el.value.trim();
        if (f.type === "number") v = +v;
        vals[f.key] = v;
        let valid = f.type === "number" ? v > 0 : !!v;
        if (f.validate) valid = valid && f.validate(v);
        ok = validateField($("#cff_"+f.key), valid) && ok;
      });
      if (!ok) return;
      setBtnLoading(btn, true);

      // 如果有 API 路径，先调用后端 API
      const doLocal = () => {
        if (rec) Object.assign(rec, vals);
        else cfg.data.unshift(Object.assign(cfg.newRec ? cfg.newRec() : {}, vals));
        closeModal(); toast((rec ? "编辑" : "新增") + "成功"); after();
      };

      if (cfg.apiPath) {
        // 将 SPA 的 MOCK 字段名映射为 API 期望的 DB 列名
        const apiVals = {};
        const fieldMap = cfg.apiFieldMap || {};
        for (const [k, v] of Object.entries(vals)) {
          apiVals[fieldMap[k] || k] = v;
        }
        apiPost(cfg.apiPath, apiVals).then(() => {
          doLocal();
        }).catch(ex => {
          toast("保存失败: " + ex.message, "error");
          setBtnLoading(btn, false);
        });
      } else {
        setTimeout(() => doLocal(), 600);
      }
    }
  });
}

function registerCrud(id, cfg){
  const ps = cfg.pageSize || 6;
  PAGES[id] = meta => `
    <div class="page-title">${meta.name}</div>
    <div class="page-desc">${cfg.desc}</div>
    <div class="card table-card reveal">
      <div class="table-toolbar">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input data-r="search" placeholder="${cfg.searchTip || "搜索..."}">
        </div>
        ${(cfg.filters||[]).map(f => `
        <select class="filter-sel" data-r="filter" data-key="${f.key}">
          <option value="">${f.label}（全部）</option>
          ${f.options.map(o => `<option>${o}</option>`).join("")}
        </select>`).join("")}
        <div class="spacer"></div>
        <button class="btn btn-primary" data-r="add">＋ ${cfg.addLabel || "新增" + cfg.entity}</button>
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr>${cfg.columns.map(c => `<th>${c.label}</th>`).join("")}<th>操作</th></tr></thead>
          <tbody data-r="tbody"></tbody>
        </table>
      </div>
      <div class="pager" data-r="pager"></div>
    </div>`;

  PAGE_INIT[id] = page => {
    const tbody = $('[data-r="tbody"]', page), pager = $('[data-r="pager"]', page);
    let kw = "", cur = 1; const fsel = {};

    const filtered = () => cfg.data.filter(r =>
      (!kw || cfg.searchKeys.some(k => String(r[k]).toLowerCase().includes(kw))) &&
      Object.entries(fsel).every(([k,v]) => !v || String(r[k]) === v));

    function render(){
      const data = filtered();
      const pages = Math.max(1, Math.ceil(data.length / ps));
      cur = Math.min(cur, pages);
      const slice = data.slice((cur-1)*ps, cur*ps);
      tbody.innerHTML = slice.length ? slice.map((r,i) => `
        <tr class="row-in" style="animation-delay:${i*40}ms" data-idx="${cfg.data.indexOf(r)}">
          ${cfg.columns.map(c => `<td>${c.render ? c.render(r) : r[c.key]}</td>`).join("")}
          <td>
            <button class="op-link" data-op="view">查看</button>
            <button class="op-link" data-op="edit">编辑</button>
            <button class="op-link danger" data-op="del">删除</button>
          </td>
        </tr>`).join("")
      : `<tr><td colspan="${cfg.columns.length+1}" style="text-align:center;color:var(--text-light);padding:34px">未找到匹配记录</td></tr>`;
      pager.innerHTML = `
        <span class="pinfo">共 ${data.length} 条记录，第 ${cur}/${pages} 页</span>
        <button ${cur===1?"disabled":""} data-pg="prev">‹</button>
        ${Array.from({length:pages}, (_,i) => `<button class="${i+1===cur?"cur":""}" data-pg="${i+1}">${i+1}</button>`).join("")}
        <button ${cur===pages?"disabled":""} data-pg="next">›</button>`;
    }

    pager.addEventListener("click", e => {
      const b = e.target.closest("button[data-pg]");
      if (!b || b.disabled) return;
      cur = b.dataset.pg === "prev" ? cur-1 : b.dataset.pg === "next" ? cur+1 : +b.dataset.pg;
      render();
    });
    $('[data-r="search"]', page).addEventListener("input", e => { kw = e.target.value.trim().toLowerCase(); cur = 1; render(); });
    $$('[data-r="filter"]', page).forEach(sel => sel.addEventListener("change", () => { fsel[sel.dataset.key] = sel.value; cur = 1; render(); }));
    $('[data-r="add"]', page).addEventListener("click", () => crudFormModal(cfg, null, render));

    tbody.addEventListener("click", e => {
      const b = e.target.closest(".op-link");
      if (!b) return;
      const rec = cfg.data[+b.closest("tr").dataset.idx];
      if (b.dataset.op === "del") {
        const doDel = () => { cfg.data.splice(cfg.data.indexOf(rec), 1); render(); };
        // 如果有 API 路径，尝试调用后端删除
        if (cfg.apiPath) {
          confirmDelete(cfg.nameOf(rec), async () => {
            try {
              await apiDel(cfg.apiPath, cfg.idParam ? {[cfg.idParam]: rec[cfg.idKey || cfg.form[0].key]} : {route_no: rec[cfg.idKey || cfg.form[0].key]});
              doDel();
            } catch(ex) { toast("删除失败: " + ex.message, "error"); }
          });
        } else {
          confirmDelete(cfg.nameOf(rec), doDel);
        }
      }
      else if (b.dataset.op === "edit") crudFormModal(cfg, rec, render);
      else openModal({title:`${cfg.entity}详情`, hideFoot:true, body:`<table class="kv">${
        cfg.columns.map(c => `<tr><td>${c.label}</td><td><b>${c.render ? c.render(rec) : rec[c.key]}</b></td></tr>`).join("")
      }</table>`});
    });

    skeletonRows(tbody, cfg.columns.length+1, ps);
    setTimeout(render, reducedMotion ? 0 : 650);
  };
}

PAGES.signup = meta => `
  <div class="page-title">游客报名</div>
  <div class="page-desc">分三步完成报名：选择线路/班次 → 填写游客信息 → 确认提交</div>
  <div class="card reveal" style="max-width:880px">
    <div class="steps" id="wizSteps">
      <div class="step active"><div class="s-dot">1</div><div class="s-name">选择线路/班次</div></div>
      <div class="s-line"></div>
      <div class="step"><div class="s-dot">2</div><div class="s-name">填写游客信息</div></div>
      <div class="s-line"></div>
      <div class="step"><div class="s-dot">3</div><div class="s-name">确认提交</div></div>
    </div>
    <div id="wizBody"></div>
    <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:22px" id="wizFoot"></div>
  </div>`;

PAGE_INIT.signup = page => {
  const st = {step:1, route:null, batch:null, name:"", idcard:"", phone:""};
  const body = $("#wizBody", page), foot = $("#wizFoot", page);

  function paintSteps(){
    const steps = $$("#wizSteps .step", page), lines = $$("#wizSteps .s-line", page);
    steps.forEach((s,i) => {
      s.classList.toggle("active", i+1 === st.step);
      s.classList.toggle("done", i+1 < st.step);
      s.querySelector(".s-dot").textContent = i+1 < st.step ? "✓" : i+1;
    });
    lines.forEach((l,i) => l.classList.toggle("done", i+1 < st.step));
  }

  function render(){
    paintSteps();
    if (st.step === 1) {
      const routes = MOCK.routes.filter(r => r.status === "在售");
      body.innerHTML = `<div class="step-panel">
        <p style="font-weight:700;margin-bottom:12px">① 选择旅游线路</p>
        <div class="pick-grid" id="wRoutes">${routes.map(r => `
          <div class="pick-card ${st.route===r.name?"sel":""}" data-route="${r.name}">
            <h4>${r.name}</h4>
            <div class="pc-sub">${r.days} 天 · ${r.spots}</div>
            <div class="pc-price" style="margin-top:8px">${fmtMoney(r.price)}<span style="font-size:12px;color:var(--text-light);font-weight:400"> /人</span></div>
          </div>`).join("")}</div>
        <div id="wBatchWrap" style="margin-top:20px">${batchListHtml()}</div>
      </div>`;
      $("#wRoutes", page).addEventListener("click", e => {
        const c = e.target.closest(".pick-card"); if (!c) return;
        st.route = c.dataset.route; st.batch = null;
        $$("#wRoutes .pick-card", page).forEach(x => x.classList.toggle("sel", x === c));
        $("#wBatchWrap", page).innerHTML = batchListHtml();
      });
      body.addEventListener("click", batchPick);
      foot.innerHTML = `<button class="btn btn-primary" id="wNext1">下一步 ›</button>`;
      $("#wNext1", page).addEventListener("click", () => {
        if (!st.route)  return toast("请先选择旅游线路", "error");
        if (!st.batch)  return toast("请选择出发班次", "error");
        st.step = 2; render();
      });
    } else if (st.step === 2) {
      body.innerHTML = `<div class="step-panel" style="max-width:460px;margin:0 auto">
        <p style="font-weight:700;margin-bottom:14px">② 填写游客信息</p>
        <div class="field" id="wfName"><label>游客姓名<span class="req">*</span></label>
          <div class="input-wrap"><input id="wName" value="${st.name}" placeholder="请输入真实姓名"><span class="check" style="right:14px">✓</span></div>
          <div class="msg">请输入游客姓名</div></div>
        <div class="field" id="wfId"><label>身份证号<span class="req">*</span></label>
          <div class="input-wrap"><input id="wId" value="${st.idcard}" maxlength="18" placeholder="18 位身份证号码"><span class="check" style="right:14px">✓</span></div>
          <div class="msg">请输入 18 位身份证号</div></div>
        <div class="field" id="wfPhone"><label>联系电话<span class="req">*</span></label>
          <div class="input-wrap"><input id="wPhone" value="${st.phone}" maxlength="11" placeholder="11 位手机号"><span class="check" style="right:14px">✓</span></div>
          <div class="msg">请输入 11 位手机号</div></div>
      </div>`;
      foot.innerHTML = `<button class="btn btn-ghost" id="wBack">‹ 上一步</button><button class="btn btn-primary" id="wNext2">下一步 ›</button>`;
      $("#wBack", page).addEventListener("click", () => { saveStep2(); st.step = 1; render(); });
      $("#wNext2", page).addEventListener("click", () => {
        saveStep2();
        let ok = true;
        ok = validateField($("#wfName", page), !!st.name) && ok;
        ok = validateField($("#wfId", page), /^\d{17}[\dXx]$/.test(st.idcard)) && ok;
        ok = validateField($("#wfPhone", page), /^1\d{10}$/.test(st.phone)) && ok;
        if (!ok) return;
        st.step = 3; render();
      });
    } else {
      const r = MOCK.routes.find(x => x.name === st.route);
      body.innerHTML = `<div class="step-panel" style="max-width:520px;margin:0 auto">
        <p style="font-weight:700;margin-bottom:14px">③ 确认报名信息</p>
        <table class="kv">
          <tr><td>旅游线路</td><td><b>${st.route}</b>（${r.days} 天）</td></tr>
          <tr><td>出发班次</td><td><span class="badge badge-blue">${st.batch.no}</span>　${st.batch.depart} 出发</td></tr>
          <tr><td>游客姓名</td><td><b>${st.name}</b></td></tr>
          <tr><td>身份证号</td><td style="font-family:Consolas,monospace">${st.idcard.slice(0,6)}********${st.idcard.slice(-4)}</td></tr>
          <tr><td>联系电话</td><td>${st.phone}</td></tr>
          <tr><td>应缴团费</td><td><b style="color:var(--accent-dark);font-size:17px">${fmtMoney(r.price)}</b></td></tr>
        </table>
      </div>`;
      foot.innerHTML = `<button class="btn btn-ghost" id="wBack">‹ 上一步</button><button class="btn btn-primary" id="wSubmit">确认提交报名</button>`;
      $("#wBack", page).addEventListener("click", () => { st.step = 2; render(); });
      $("#wSubmit", page).addEventListener("click", e => {
        const btn = e.currentTarget;
        setBtnLoading(btn, true);
        setTimeout(() => {
          const id = "BM" + Date.now().toString().slice(-8);
          st.batch.count++;
          if (st.batch.count >= 50) st.batch.status = "已满";
          MOCK.tourists.unshift({name:st.name, idcard:st.idcard.slice(0,6)+"********"+st.idcard.slice(-4), phone:st.phone.slice(0,3)+"****"+st.phone.slice(-4), batch:st.batch.no, group:"", status:"已报名"});
          $$("#wizSteps .step", page).forEach(s => { s.classList.add("done"); s.classList.remove("active"); s.querySelector(".s-dot").textContent = "✓"; });
          $$("#wizSteps .s-line", page).forEach(l => l.classList.add("done"));
          body.innerHTML = `<div class="receipt" style="max-width:520px;margin:0 auto">
            <h4>✈ 报名回执单</h4>
            <table class="kv">
              <tr><td>报名编号</td><td><b style="font-family:Consolas,monospace">${id}</b></td></tr>
              <tr><td>游客姓名</td><td><b>${st.name}</b></td></tr>
              <tr><td>线路/班次</td><td>${st.route}　<span class="badge badge-blue">${st.batch.no}</span></td></tr>
              <tr><td>出发日期</td><td>${st.batch.depart}</td></tr>
              <tr><td>应缴团费</td><td><b style="color:var(--accent-dark)">${fmtMoney(r.price)}</b></td></tr>
              <tr><td>报名状态</td><td>${sBadge("已报名")}</td></tr>
            </table>
            <p style="color:var(--text-light);font-size:12px;margin-top:10px">请妥善保存报名编号，出团前 3 天将以短信通知集合信息。</p>
          </div>`;
          foot.innerHTML = `<button class="btn btn-blue" id="wAgain">＋ 再报一单</button>`;
          $("#wAgain", page).addEventListener("click", () => { Object.assign(st, {step:1, route:null, batch:null, name:"", idcard:"", phone:""}); render(); });
          toast("报名成功！回执已生成");
        }, 900);
      });
    }
  }

  function saveStep2(){
    st.name = ($("#wName", page)?.value || st.name).trim();
    st.idcard = ($("#wId", page)?.value || st.idcard).trim();
    st.phone = ($("#wPhone", page)?.value || st.phone).trim();
  }
  function batchListHtml(){
    if (!st.route) return `<p style="color:var(--text-light);font-size:13px">请先选择线路，再挑选出发班次</p>`;
    const bs = MOCK.batches.filter(b => b.route === st.route && (b.status === "报名中" || b.status === "已满"));
    if (!bs.length) return `<p style="color:var(--text-light)">该线路暂无可报名班次</p>`;
    return `<p style="font-weight:700;margin-bottom:12px">② 选择出发班次</p>
      <div class="pick-grid">${bs.map(b => `
        <div class="pick-card ${b.status==="已满"?"disabled":""} ${st.batch===b?"sel":""}" data-batch="${b.no}">
          <h4>${b.no}　${sBadge(b.status)}</h4>
          <div class="pc-sub">出发日期：${b.depart}</div>
          <div style="display:flex;align-items:center;gap:8px;margin-top:8px">
            <div class="progress" style="flex:1"><i class="${b.count>=20?"ok":"warn"}" style="--p:${Math.min(b.count/50,1)}"></i></div>
            <span style="font-size:12px;color:var(--text-light)">${b.count}/50</span>
          </div>
        </div>`).join("")}</div>`;
  }
  function batchPick(e){
    const c = e.target.closest(".pick-card[data-batch]");
    if (!c || c.classList.contains("disabled")) return;
    st.batch = MOCK.batches.find(b => b.no === c.dataset.batch);
    $$(".pick-card[data-batch]", page).forEach(x => x.classList.toggle("sel", x === c));
  }
  render();
};

  <div class="page-title">入团 / 退团操作</div>

      <label style="font-weight:700">选择旅游团：</label>

        ${MOCK.groups.filter(g => g.status !== "已解散").map(g => `<option value="${g.name}">${g.name}（${g.batch}）</option>`).join("")}
      </select>
      <span style="color:var(--text-light);font-size:12.5px">💡 拖动卡片到另一侧，或点击卡片上的按钮</span>
    </div>
    <div class="transfer">
      <div class="t-panel" data-zone="wait">
        <div class="t-head">⏳ 待分配游客 <span class="badge badge-orange" id="jqWaitN"></span></div>
        <div data-list="wait"></div>
      </div>
      <div class="t-panel" data-zone="in">
        <div class="t-head">✅ 已入团名单 <span class="badge badge-green" id="jqInN"></span></div>
        <div data-list="in"></div>
      </div>
    </div>
  </div>`;

PAGE_INIT.joinQuit = page => {
  const sel = $("#jqGroup", page);
  let group = MOCK.groups.find(g => g.name === sel.value);

  function lists(){
    return {
      wait: MOCK.tourists.filter(t => t.batch === group.batch && t.status === "已报名"),
      inn:  MOCK.tourists.filter(t => t.group === group.name && t.status === "已入团"),
    };
  }
  function itemHtml(t, zone, i){
    return `<div class="t-item" draggable="true" data-name="${t.name}" style="animation-delay:${i*40}ms">
      <span><b>${t.name}</b><br><span class="ti-sub">证件尾号 ${t.idcard.slice(-4)} · ${t.phone}</span></span>
      ${zone === "wait"
        ? `<button class="op-link" data-act="join">入团 →</button>`
        : `<button class="op-link danger" data-act="quit">← 退团</button>`}
    </div>`;
  }
  function render(){
    const {wait, inn} = lists();
    $('[data-list="wait"]', page).innerHTML = wait.length ? wait.map((t,i) => itemHtml(t,"wait",i)).join("") : `<p style="color:var(--text-light);font-size:13px;padding:8px">暂无待分配游客</p>`;
    $('[data-list="in"]', page).innerHTML  = inn.length  ? inn.map((t,i) => itemHtml(t,"in",i)).join("")  : `<p style="color:var(--text-light);font-size:13px;padding:8px">暂无团员，从左侧拖入</p>`;
    $("#jqWaitN", page).textContent = wait.length + " 人";
    $("#jqInN", page).textContent = inn.length + " 人";
  }
  function move(name, toZone){
    const t = MOCK.tourists.find(x => x.name === name && x.batch === group.batch);
    if (!t) return;
    if (toZone === "in" && t.status === "已报名") {
      t.group = group.name; t.status = "已入团"; group.members++;
      toast(`${t.name} 已加入「${group.name}」`);
    } else if (toZone === "wait" && t.status === "已入团") {
      t.group = ""; t.status = "已报名"; group.members--;
      toast(`${t.name} 已退团`, "info");
    } else return;
    group.status = group.members >= 20 ? "已成团" : "未成团";
    render();
  }

  sel.addEventListener("change", () => { group = MOCK.groups.find(g => g.name === sel.value); render(); });
  page.addEventListener("click", e => {
    const b = e.target.closest("[data-act]");
    if (b) move(b.closest(".t-item").dataset.name, b.dataset.act === "join" ? "in" : "wait");
  });
  /* 拖拽 */
  page.addEventListener("dragstart", e => {
    const it = e.target.closest(".t-item"); if (!it) return;
    it.classList.add("dragging");
    e.dataTransfer.setData("text/plain", it.dataset.name);
  });
  page.addEventListener("dragend", e => e.target.closest(".t-item")?.classList.remove("dragging"));
  $$(".t-panel", page).forEach(p => {
    p.addEventListener("dragover", e => { e.preventDefault(); p.classList.add("dragover"); });
    p.addEventListener("dragleave", () => p.classList.remove("dragover"));
    p.addEventListener("drop", e => {
      e.preventDefault(); p.classList.remove("dragover");
      move(e.dataTransfer.getData("text/plain"), p.dataset.zone);
    });
  });
  render();
};

  $("#gcRun", page).addEventListener("click", e => {
    const btn = e.currentTarget;
    setBtnLoading(btn, true, "校验中...");
    setTimeout(() => {
      setBtnLoading(btn, false);
      let pass = 0, fail = 0;
      $$("#gcGrid .card", page).forEach((card, i) => {
        const g = MOCK.groups.find(x => x.name === card.dataset.g);

          card.classList.remove("flash-green","flash-red");

============================================================ */
function calcFees(g){
  const r = routeOf(g.batch) || {price:2000, days:4};
  const nights = Math.max(r.days - 1, 1);
  const signup = g.members * r.price;
  const hotelRec = MOCK.hotels.find(h => h.name === g.hotel);
  const hotelFee = g.hotel ? Math.ceil(g.members/2) * nights * (hotelRec ? hotelRec.price : 300) : 0;
  const insFee = g.insured ? g.members * 30 : 0;
  return {signup, hotelFee, insFee, total: signup + hotelFee + insFee};
}

/* ============================================================
   图表构建器（纯 SVG / DOM，无第三方库）
============================================================ */
function lineChartSVG(labels, values){
  const w = 680, h = 250, pad = 40;
  const max = Math.max(...values, 1) * 1.2;
  const n = values.length;
  const X = i => pad + i * ((w - pad*2) / Math.max(n-1, 1));
  const Y = v => h - pad - (v / max) * (h - pad*2);
  const pts = values.map((v,i) => [X(i), Y(v)]);
  const poly = pts.map(p => p.map(x => x.toFixed(1)).join(",")).join(" ");
  const area = `M${pts[0][0].toFixed(1)},${h-pad} ` + pts.map(p => `L${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ") + ` L${pts[n-1][0].toFixed(1)},${h-pad} Z`;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:${w}px;display:block;margin:0 auto">
    <defs><linearGradient id="lcGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A6B8A" stop-opacity=".22"/><stop offset="1" stop-color="#1A6B8A" stop-opacity="0"/>
    </linearGradient></defs>
    ${[0,1,2,3].map(i => { const gy = (pad + (h-pad*2)*i/3).toFixed(1);
      return `<line x1="${pad}" x2="${w-pad}" y1="${gy}" y2="${gy}" stroke="#E2E8F0" stroke-dasharray="4 4"/>`; }).join("")}
    <path class="line-area" d="${area}" fill="url(#lcGrad)"/>
    <polyline class="line-path" pathLength="1" points="${poly}"/>
    ${pts.map((p,i) => `<circle class="line-dot" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4.5" style="animation-delay:${(.3+i*.12).toFixed(2)}s"><title>${labels[i]}：${values[i]} 人</title></circle>`).join("")}
    ${labels.map((l,i) => `<text x="${X(i).toFixed(1)}" y="${h-12}" text-anchor="middle" font-size="11" fill="#7F8C9B">${l}</text>`).join("")}
    ${pts.map((p,i) => `<text x="${p[0].toFixed(1)}" y="${(p[1]-11).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="#1A6B8A">${values[i]}</text>`).join("")}
  </svg>`;
}

function barChartHTML(items, unit=""){
  const max = Math.max(...items.map(i => i.value)) * 1.12;
  return `<div class="bars">${items.map((it,i) => `
    <div class="bar-col" title="${it.label}：${it.value}${unit}">
      <div class="bv">${it.value}</div>
      <div class="bar-zone"><div class="bar" style="height:${(it.value/max*100).toFixed(1)}%;animation-delay:${i*80}ms"></div></div>
      <div class="bl">${it.label}</div>
    </div>`).join("")}</div>`;
}

function pieSVG(data){
  const cx = 110, cy = 110, r = 95;
  const total = data.reduce((s,d) => s + d.value, 0);
  let a0 = -Math.PI/2, out = "";
  data.forEach((d,i) => {
    const a1 = a0 + d.value/total * 2*Math.PI;
    const large = (a1 - a0) > Math.PI ? 1 : 0;
    const mid = (a0+a1)/2;
    out += `<path class="pie-sector"
      d="M${cx} ${cy} L${(cx+r*Math.cos(a0)).toFixed(2)} ${(cy+r*Math.sin(a0)).toFixed(2)} A${r} ${r} 0 ${large} 1 ${(cx+r*Math.cos(a1)).toFixed(2)} ${(cy+r*Math.sin(a1)).toFixed(2)} Z"
      fill="${d.color}" style="--px:${(Math.cos(mid)*8).toFixed(2)}px;--py:${(Math.sin(mid)*8).toFixed(2)}px;animation-delay:${(.2+i*.12).toFixed(2)}s">
      <title>${d.label}：${(d.value/total*100).toFixed(1)}%</title></path>`;
    a0 = a1;
  });
  return `<svg viewBox="0 0 220 220" width="220" height="220"><g class="pie-spin">${out}</g></svg>`;
}

function exportCSV(filename, headers, rows){
  const csv = String.fromCharCode(0xFEFF) + [headers, ...rows].map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv;charset=utf-8"}));
  a.download = filename; a.click();
  URL.revokeObjectURL(a.href);
}

function schedMap(){

        ${Object.entries(GUIDE_COLORS).slice(0,5).map(([n,c]) => `<span style="display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text-light)"><i style="width:10px;height:10px;border-radius:3px;background:${c}"></i>${n}</span>`).join("")}
      </div>
    </div>
    <div class="cal" id="calGrid"></div>
  </div>`;

PAGE_INIT.qGuide = page => {
  let y = 2026, m = 6;
  const map = schedMap();
  function render(){
    $("#calTitle", page).textContent = `${y} 年 ${m} 月`;
    const first = new Date(y, m-1, 1).getDay();
    const days = new Date(y, m, 0).getDate();
    let html = ["日","一","二","三","四","五","六"].map(w => `<div class="wd">周${w}</div>`).join("");
    for (let i = 0; i < first; i++) html += `<div class="cal-cell empty"></div>`;
    for (let d = 1; d <= days; d++) {
      const key = `${y}-${pad2(m)}-${pad2(d)}`;
      const list = map[key] || [];
      const isToday = key === "2026-06-13";
      html += `<div class="cal-cell ${isToday?"today":""}" data-date="${key}" style="animation-delay:${(first+d)*12}ms">
        <div class="d">${d}${isToday?" · 今天":""}</div>
        ${list.slice(0,2).map(s => `<span class="cal-tag" style="background:${GUIDE_COLORS[s.guide]||"#7F8C9B"}">${s.guide} · ${s.group}</span>`).join("")}
        ${list.length > 2 ? `<span class="cal-tag" style="background:#9DB0BE">+${list.length-2} 个排班</span>` : ""}
      </div>`;
    }
    $("#calGrid", page).innerHTML = html;
  }
  $("#calPrev", page).addEventListener("click", () => { if (--m < 1) { m = 12; y--; } render(); });
  $("#calNext", page).addEventListener("click", () => { if (++m > 12) { m = 1; y++; } render(); });
  $("#calGrid", page).addEventListener("click", e => {
    const cell = e.target.closest(".cal-cell[data-date]");
    if (!cell) return;
    const key = cell.dataset.date, list = map[key] || [];
    openModal({title:`${key} 导游排班`, hideFoot:true, body: list.length
      ? `<table class="kv">${list.map(s => `
          <tr><td><span class="badge" style="background:${GUIDE_COLORS[s.guide]}22;color:${GUIDE_COLORS[s.guide]}"><span class="dot" style="background:${GUIDE_COLORS[s.guide]}"></span>${s.guide}</span></td>
          <td><b>${s.group}</b>　<span style="color:var(--text-light);font-size:12.5px">${s.from} 起，共 ${s.days} 天</span></td></tr>`).join("")}</table>`
      : `<p style="text-align:center;color:var(--text-light);padding:18px">当日无导游排班 🏖</p>`});
  });
  render();
};

PAGE_INIT.qHotel = page => {
  const tbody = $("#qhTbody", page);
  function render(){
    const h = $("#qhHotel", page).value, f = $("#qhFrom", page).value, t = $("#qhTo", page).value;
    const data = RECEPTIONS.filter(r => (!h || r.hotel === h) && (!t || r.in <= t) && (!f || r.out >= f));
    tbody.innerHTML = data.length ? data.map((r,i) => `
      <tr class="row-in" style="animation-delay:${i*40}ms">
        <td><b>${r.hotel}</b></td>
        <td>${r.group}</td>
        <td>${r.in}</td><td>${r.out}</td>
        <td>${r.rooms} 间</td>
        <td><div style="display:flex;align-items:center;gap:9px;min-width:150px">
          <div class="progress" style="flex:1"><i class="${r.rate>=80?"ok":r.rate>=50?"warn":"bad"}" style="--p:${r.rate/100}"></i></div>
          <b style="font-size:12.5px;color:${r.rate>=80?"var(--success)":r.rate>=50?"var(--warning)":"var(--danger)"}">${r.rate}%</b></div></td>
      </tr>`).join("")
      : `<tr><td colspan="6" style="text-align:center;color:var(--text-light);padding:34px">该时间段无接待记录</td></tr>`;
    const avg = data.length ? Math.round(data.reduce((s,r) => s + r.rate, 0) / data.length) : 0;
    $("#qhInfo", page).textContent = `共 ${data.length} 条接待记录，平均入住率 ${avg}%`;
  }
  ["qhHotel","qhFrom","qhTo"].forEach(id => $("#"+id, page).addEventListener("change", render));
  skeletonRows(tbody, 6, 5);
  setTimeout(render, reducedMotion ? 0 : 600);
};
